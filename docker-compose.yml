services:
  backend:
    build:
      context: ./backend/Creditcore_backend
    container_name: creditcore-backend
    ports:
      - "127.0.0.1:8086:8086"
    environment:
      - DB_URL=${DB_URL}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --tries=1 http://localhost:8086/api/auth/login 2>&1 | grep -q 'HTTP/' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

  frontend:
    build:
      context: ./frontend/frontendreactapp
    container_name: creditcore-frontend
    ports:
      - "127.0.0.1:3086:80"
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8086}
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
    restart: always
    depends_on:
      backend:
        condition: service_healthy

  # Optional local database (only used if explicitly started with --profile local-db)
  db:
    profiles:
      - local-db
    image: postgres:16-alpine
    container_name: creditcore-db
    restart: always
    environment:
      POSTGRES_DB: creditcore
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d creditcore"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:


