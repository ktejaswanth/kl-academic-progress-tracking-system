spring.application.name=Creditcore_backend
server.port=8086

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=86400000

# Hikari Connection Pool Optimizations for Supabase
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.connection-timeout=30000

# SMTP Configuration (Supabase)
spring.mail.host=smtp.supabase.co
spring.mail.port=587
spring.mail.username=${DB_USERNAME}
spring.mail.password=${DB_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Gemini AI Configuration
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=${GEMINI_API_MODEL:gemini-flash-latest}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta

# File upload limits (curriculum PDFs can be large)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

